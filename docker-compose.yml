services:
  db:
    image: postgres:16-alpine
    container_name: orienteering_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

  setup:
    build:
      context: ./setup
      dockerfile: Dockerfile.setup
    container_name: orienteering_setup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c '
        psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /opt/setup/create_schema.sql ;
        psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /opt/setup/populate_schema.sql ;
      '
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: orienteering_backend
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PORT: ${PORT}
      FLASK_DEBUG: ${FLASK_DEBUG}
    ports:
      - "${PORT}:5000"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:5000/api/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - frontend_network
      - backend_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: orienteering_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_network

volumes:
  pgdata:

networks:
  frontend_network:
    driver: bridge
  backend_network:
    driver: bridge
